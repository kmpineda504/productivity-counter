<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Counter</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- LEFT DEPARTMENT MENU -->
    <button id="menuButton" class="menu-button" title="Departments menu">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- RIGHT TEMPLATE BUTTON -->
    <button id="templatesToggle" class="templates-btn">
        <i class="fa-solid fa-puzzle-piece"></i> Templates
    </button>

    <!-- EXISTING DEPARTMENT SIDEBAR -->
    <div id="sidebar" class="sidebar">
        <h2>Departments</h2>

        <button onclick="switchDepartment('cargo')">
            Cargo
        </button>

        <button onclick="switchDepartment('reservations')">
            Reservations
        </button>

        <button onclick="switchDepartment('customer_care')">
            Customer Care
        </button>

        <div class="sidebar-tools">

            <button class="backup-btn" onclick="exportData()">
                <i class="fa-regular fa-floppy-disk"></i> Backup data
            </button>

            <button class="restore-btn" onclick="importData()">
                <i class="fa-solid fa-file-arrow-down"></i> Import data
            </button>

            <button id="themeToggle" class="collapse-btn">
                🌙 Dark Mode
            </button>

            <button id="collapseBtn" class="collapse-btn">
                <i class="fa-solid fa-arrow-left"></i> Hide menu         
            </button>

        </div>

    </div>

    <!-- MAIN LAYOUT -->
    <div class="app-layout">

        <!-- MAIN CONTENT -->
        <div id="mainContent" class="main-content">

            <h1>Productivity Counter</h1>

            <h2 id="currentDepartment"></h2>

            <p id="currentDate"></p>

            <p id="lastSaved"></p>

            <!-- KEEP YOUR CURRENT PROGRESS SECTION HERE -->
            <div class="progress-section">

                <div class="progress-bar">
                    <div id="progressFill"></div>
                </div>

              <p id="progressPercent">0%</p>

              <p id="minutesProduced">
                  0 / 435 productive minutes
              </p>

            </div>

            <!-- KEEP YOUR CURRENT CARD CONTAINER -->
            <div class="container">

                <div id="cardsContainer" class="cards">

                    <!-- Generated by JS -->

                </div>

                <button class="reset-btn" onclick="resetCounters()">
                    Reset All
                </button>
            </div>

        </div>

        <!-- RIGHT TEMPLATE PANEL -->
        <div id="templatesPanel" class="templates-panel">

            <button id="closeTemplates" class="templates-close">
                <i class="fa-solid fa-angles-right"></i>
            </button>

            <h2>Templates</h2>
            <div id="templatesContainer"></div>
        </div>

    </div>

    <script src="data/templates/cargo.js"></script>
    <script src="data/departments.js"></script>
    <script src="data/productivity.js"></script>
    <script src="script.js"></script>

</body>
</html>
